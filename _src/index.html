<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mouse Wizard</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    <script>const cursors = {{ cursors | json }};</script>
    <script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.7/Sortable.min.js"></script>
    <link rel="stylesheet" href="/css/style.css" />
    <link rel="stylesheet" href="/css/shortcuts.css" />
</head>
<body>
    <banner><div>
        <a class="header no-select" href="https://simplysalt.dev">
            {% include "siteheader.svg.html" %}
            <!-- <img src="/assets/siteheader-8x.png" class="crisp"> -->
        </a></div>
        </banner>
    <div id="drop-zone-overlay">Drop files or folders</div>

    <div class="controls container">
        <label>Theme Name:
            <input type="text"
            id="cursor-theme-name"
            placeholder="Untitled"
            pattern="^\S+$">
        </label>
        <label><input type="checkbox"
            id="preview-cursors-toggle">Preview cursors</label>
</div>
    
    <div class="main-layout">
        <div class="grid"
        id="cursor-grid"
        data-preview-cursors="false">
            {% for cursor in cursors %}
    <div class="slot container"
    data-cursor-id="{{ cursor.id }}"
            data-assigned="false"
            data-cursor-css="{{ cursor.css }}">
                <div class="cursor-label">{{ cursor.label }}</div>
                <div class="drag-drop">Drag/Drop here</div><div class="file-name"></div>
                <div class="sortable-zone" data-group="cursors"></div>
                <!-- <button onclick="unassign('{{ cursor.id }}')"
                class="unassign-btn">Unassign</button> -->
            </div>
            {% endfor %}
        </div>

        <div class="tray container">
            <h3 class="no-select">Unassigned</h3>
            <div id="tray-content" class="sortable-zone" data-group="cursors">
                {% for i in (1..19) %}
                    {% include "cursor-item.html" %}
                {% endfor %}
            </div>
            <div class="cursor-item-placeholder none-select">
                <p class="drag-drop centered">Drag and drop your cursor files in here!</p>
            </div>
        </div>
    </div>

    <div class="footer"></div>
    <!-- <script>
        window.addEventListener('beforeunload', (event) => {
    // Trigger the confirmation dialog.
    event.preventDefault();
    // (Chrome requires returnValue to be set.)
    event.returnValue = '';
});
    </script> -->

<script defer src="/js/script.js"></script>
</body>
</html>
