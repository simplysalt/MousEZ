<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mouse Wizard</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    <link rel="stylesheet" href="/css/style.css" />
    <link rel="stylesheet" href="/css/shortcuts.css" />
</head>
<body>
    <banner>
        <a class="header no-select" href="https://simplysalt.dev">
            <!-- {% include "siteheader.svg.html" %} -->
            <img src="/assets/siteheader-8x.png" class="crisp">
        </a>
        <button id="faq-btn">?</button>
    </banner>
    <div id="drop-zone-overlay">Drop files or folders anywhere</div>
    
    <div class="controls container">
        <label>Theme Name: <input type="text" id="theme-name" placeholder="Untitled" pattern="^\S+$"></label>
        <span class="hint-text">Drag items or handles to copy/move between slots.</span>
        <button onclick="toggleHoverCurs()">Click! <span id="hover-curs-state"></span></button>
        <button onclick="render()"></button>
    </div>
    
    <div class="main-layout">
        <div class="grid" id="cursor-grid">
            {% for i in (1..10) %}
            <div class="slot loading">
                <div class="cursor-label"></div>
                <div class="drag-drop"></div>
            </div> 
            {% endfor %}

        </div>
        <div class="tray container" id="unassigned-tray">
            <h3 style="margin-block: .1em; margin-inline: .1em;">Cursors</h3>
            <div id="tray-content">
                {% for i in (1..10) %}
                <div class="slot loading">
                    <div class="cursor-label" style="color: #fff0">{{ forloop.index }}</div>
                    <div class="drag-drop"></div>
                </div>
                {% endfor %}
            </div>
        </div>
    </div>

    <div class="footer"></div>

<script defer src="/js/script.js"></script>
</body>
</html>
